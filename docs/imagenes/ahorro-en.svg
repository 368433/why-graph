<text x="286" y="331" fill="#E6EAFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" text-anchor="end">15,600</text>
<text x="286" y="346" fill="rgba(230,234,255,.40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">index plus the right pages</text>
<text x="760" y="331" fill="#E6EAFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" text-anchor="end">147,800</text>
<text x="760" y="346" fill="rgba(230,234,255,.40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">dump the whole wiki</text>
<text x="880" y="334" fill="#1FC8B4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600" text-anchor="end">9×</text>
<text x="40" y="372" fill="rgba(230,234,255,.40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Method: characters ÷ 3.7 (technical Spanish), ±15%. Bars are proportional — no log scale. The last row is an upper</text>
<text x="40" y="387" fill="rgba(230,234,255,.40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">bound: nobody dumps a whole wiki on every question.</text>
</svg>