<text x="286" y="167" fill="#E6EAFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" text-anchor="end">25</text>
<text x="286" y="182" fill="rgba(230,234,255,.40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">read the reason</text>
<text x="760" y="167" fill="#E6EAFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" text-anchor="end">2,832</text>
<text x="760" y="182" fill="rgba(230,234,255,.40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">read both notes</text>
<text x="880" y="170" fill="#1FC8B4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600" text-anchor="end">115×</text>
<text x="40" y="220" fill="#E6EAFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Give me the context of a topic</text>
<rect x="300" y="232" width="470" height="26" rx="4" fill="#2A3566"/>
<rect x="300" y="232" width="12.39423076923077" height="26" rx="4" fill="#0B1026"/>
<rect x="300" y="232" width="10.39423076923077" height="26" rx="4" fill="#1FC8B4"/>
<text x="286" y="249" fill="#E6EAFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" text-anchor="end">460</text>
<text x="286" y="264" fill="rgba(230,234,255,.40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">read its synthesis</text>
<text x="760" y="249" fill="#E6EAFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" text-anchor="end">20,800</text>
<text x="760" y="264" fill="rgba(230,234,255,.40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">read all its notes</text>
<text x="880" y="252" fill="#1FC8B4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600" text-anchor="end">45×</text>
<text x="40" y="302" fill="#E6EAFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">One query against the vault</text>
<rect x="300" y="314" width="470" height="26" rx="4" fill="#2A3566"/>
<rect x="300" y="314" width="51.60757780784844" height="26" rx="4" fill="#0B1026"/>
