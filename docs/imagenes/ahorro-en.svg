<text x="880" y="112" fill="rgba(230,234,255,.40)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" text-anchor="end">input tokens</text>
<text x="40" y="138" fill="#E6EAFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Why are these two notes connected?</text>
