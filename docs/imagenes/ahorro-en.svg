<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="What a written reason saves">
<rect width="920" height="400" rx="14" fill="#0B1026"/>
<text x="40" y="52" fill="#E6EAFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600">What a written reason saves</text>
<text x="40" y="76" fill="rgba(230,234,255,.62)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">Measured on a real vault of 254 notes and 916 links</text>
